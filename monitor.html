<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panfitrión — Monitor de Cocina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c0a09;
      --surface: #1c1917;
      --text: #fafaf9;
      --text-secondary: #a8a29e;
      --accent: #a3e635;
      --accent-dim: #65a30d;
      --border: #292524;
      --radius: 12px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow: hidden;
    }

    /* Header */
    .header {
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: var(--accent);
    }
    .header .date {
      font-size: 1.1rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* Product List */
    .monitor-list {
      padding: 16px 32px;
      height: calc(100dvh - 100px);
      overflow: hidden;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 10px;
    }

    .monitor-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      transition: background 0.3s;
    }

    .monitor-item .name {
      font-size: 2rem;
      font-weight: 700;
      flex: 1;
    }

    .monitor-item .count {
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--accent);
      min-width: 80px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .monitor-item .unit {
      font-size: 1rem;
      color: var(--text-secondary);
      font-weight: 500;
      margin-left: 8px;
      min-width: 60px;
    }

    /* Flash animation */
    @keyframes flash-highlight {
      0% { background: #365314; border-color: var(--accent); }
      100% { background: var(--surface); border-color: var(--border); }
    }
    .monitor-item.flash {
      animation: flash-highlight 1s ease-out;
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-secondary);
    }
    .empty-state .icon { font-size: 4rem; margin-bottom: 16px; }
    .empty-state p { font-size: 1.3rem; line-height: 1.6; }

    /* Responsive */
    @media (max-width: 768px) {
      .header { padding: 16px 20px; }
      .header h1 { font-size: 1.4rem; }
      .header .date { font-size: 0.9rem; }
      .monitor-list { padding: 12px 16px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
      .monitor-item { padding: 12px 16px; }
      .monitor-item .name { font-size: 1.5rem; }
      .monitor-item .count { font-size: 2rem; min-width: 60px; }
      .monitor-item .unit { font-size: 0.9rem; }
    }
  </style>
</head>
<body>

  <header class="header">
    <h1>🍞 Panfitrión</h1>
    <div class="date" id="currentDate"></div>
  </header>

  <div class="monitor-list" id="monitorList"></div>

  <script>
    // ===========================
    // CONFIGURACIÓN
    // ===========================
    const STORAGE_KEY = 'panfitrion_productos';

    // ===========================
    // ESTADO
    // ===========================
    let productos = [];
    let previousTotals = {};

    // ===========================
    // DOM
    // ===========================
    const monitorList = document.getElementById('monitorList');
    const currentDate = document.getElementById('currentDate');

    // ===========================
    // FECHA
    // ===========================
    function formatDate() {
      const now = new Date();
      const days = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
      const months = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      return `${days[now.getDay()]} ${now.getDate()} de ${months[now.getMonth()]} de ${now.getFullYear()}`;
    }
    currentDate.textContent = formatDate();

    // ===========================
    // LOCAL STORAGE
    // ===========================
    function loadProductos() {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    }

    function fetchProductos() {
      productos = loadProductos();
      // Store previous totals for animation
      productos.forEach(p => {
        if (!(p.id in previousTotals)) {
          previousTotals[p.id] = p.totalDia;
        }
      });
      render();
    }

    // ===========================
    // RENDER
    // ===========================
    function render(oldTotals = {}) {
      if (productos.length === 0) {
        monitorList.innerHTML = `
          <div class="empty-state">
            <div class="icon">📦</div>
            <p>El catálogo está vacío.<br>Agrégalo desde el panel de administración.</p>
          </div>`;
        return;
      }

      monitorList.innerHTML = productos.map(p => {
        const changed = oldTotals[p.id] !== undefined && oldTotals[p.id] !== p.totalDia;
        return `
          <div class="monitor-item ${changed ? 'flash' : ''}" data-id="${p.id}">
            <span class="name">${escapeHtml(p.nombre)}</span>
            <span class="count">${p.totalDia}</span>
            <span class="unit">piezas</span>
          </div>`;
      }).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ===========================
    // STORAGE EVENT
    // ===========================
    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY) {
        const oldTotals = {};
        productos.forEach(p => { oldTotals[p.id] = p.totalDia; });
        productos = loadProductos();
        render(oldTotals);
      }
    });

    // ===========================
    // INIT
    // ===========================
    fetchProductos();

    // Update date every minute
    setInterval(() => {
      currentDate.textContent = formatDate();
    }, 60000);
  </script>
</body>
</html>
